[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxchat"
version = "0.9.0"
description = "A comic-strip-style graphical IRC client."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["PySide6>=6.6", "pyspellchecker>=0.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4", "ruff>=0.4", "black>=24", "pyinstaller>=6"]

[project.gui-scripts]
maxchat = "maxchat.app:main"

[tool.setuptools.packages.find]
include = ["maxchat*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E702"]  # compact `a; b` state-machine lines in the IRC parser are intentional

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
